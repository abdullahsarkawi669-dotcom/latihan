<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031526"/>
      <stop offset="100%" stop-color="#072238"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0087a3"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle star pattern -->
  <g opacity="0.15" fill="#00d2ff">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="430" cy="80" r="2"/>
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="400" cy="220" r="1.5"/>
    <circle cx="60" cy="320" r="1.5"/>
    <circle cx="450" cy="340" r="1.5"/>
  </g>

  <!-- MOSQUE (no cross — uses crescent moon finial) -->
  <g transform="translate(256, 215)">
    <!-- Left minaret -->
    <rect x="-115" y="-50" width="22" height="155" fill="url(#dome)" opacity="0.85"/>
    <circle cx="-104" cy="-58" r="16" fill="url(#dome)"/>
    <rect x="-108" y="-78" width="8" height="20" fill="url(#dome)"/>
    <!-- Small crescent on top of left minaret -->
    <path d="M -104,-86 a 7,7 0 1 1 5,-12 a 5.5,5.5 0 1 0 -4,10 a 7,7 0 0 1 -1,2 z" fill="#00d2ff"/>

    <!-- Right minaret -->
    <rect x="93" y="-50" width="22" height="155" fill="url(#dome)" opacity="0.85"/>
    <circle cx="104" cy="-58" r="16" fill="url(#dome)"/>
    <rect x="100" y="-78" width="8" height="20" fill="url(#dome)"/>
    <!-- Small crescent on top of right minaret -->
    <path d="M 104,-86 a 7,7 0 1 1 5,-12 a 5.5,5.5 0 1 0 -4,10 a 7,7 0 0 1 -1,2 z" fill="#00d2ff"/>

    <!-- Main dome -->
    <path d="M -95,5 A 95,95 0 0 1 95,5 Z" fill="url(#dome)"/>
    <!-- Dome base -->
    <rect x="-100" y="0" width="200" height="15" fill="#0087a3"/>

    <!-- Building body -->
    <rect x="-100" y="10" width="200" height="110" fill="url(#dome)"/>

    <!-- Arched entrance (mehrab) -->
    <path d="M -25,120 L -25,80 A 25,25 0 0 1 25,80 L 25,120 Z" fill="#031526"/>
    <!-- Entrance arch inner detail -->
    <path d="M -18,120 L -18,85 A 18,18 0 0 1 18,85 L 18,120 Z" fill="#072238"/>

    <!-- Side windows -->
    <rect x="-80" y="50" width="14" height="28" rx="7" fill="#031526" opacity="0.7"/>
    <rect x="66" y="50" width="14" height="28" rx="7" fill="#031526" opacity="0.7"/>

    <!-- Main finial pole (NO CROSS — just a pole with crescent moon on top) -->
    <rect x="-3" y="-25" width="6" height="30" fill="#00d2ff"/>
    <!-- Crescent moon finial -->
    <path d="M 0,-30 a 14,14 0 1 1 10,-24 a 11,11 0 1 0 -7,20 a 14,14 0 0 1 -3,4 z" fill="#00d2ff"/>
  </g>

  <!-- OPEN BOOK at bottom -->
  <g transform="translate(256, 430)">
    <!-- Book shadow -->
    <ellipse cx="0" cy="20" rx="135" ry="8" fill="#000" opacity="0.3"/>
    <!-- Left page -->
    <path d="M 0,0 L -125,-18 L -125,-55 L 0,-45 Z" fill="url(#book)"/>
    <!-- Right page -->
    <path d="M 0,0 L 125,-18 L 125,-55 L 0,-45 Z" fill="url(#book)"/>
    <!-- Page edges -->
    <path d="M -125,-18 L -130,-12 L -130,-50 L -125,-55 Z" fill="#047857"/>
    <path d="M 125,-18 L 130,-12 L 130,-50 L 125,-55 Z" fill="#047857"/>
    <!-- Spine highlight -->
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#031526" stroke-width="3"/>
    <!-- Page text lines -->
    <line x1="-105" y1="-28" x2="-25" y2="-22" stroke="#031526" stroke-width="2" opacity="0.4"/>
    <line x1="-105" y1="-38" x2="-25" y2="-32" stroke="#031526" stroke-width="2" opacity="0.4"/>
    <line x1="-105" y1="-48" x2="-50" y2="-44" stroke="#031526" stroke-width="2" opacity="0.4"/>
    <line x1="25" y1="-22" x2="105" y2="-28" stroke="#031526" stroke-width="2" opacity="0.4"/>
    <line x1="25" y1="-32" x2="105" y2="-38" stroke="#031526" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="-44" x2="105" y2="-48" stroke="#031526" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
